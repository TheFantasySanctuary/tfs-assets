name: Injury report data

on:
  schedule:
    # every 3 hours, September to February
    - cron: "17 */3 * 9-12,1,2 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: injury-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache nflverse history
        uses: actions/cache@v4
        with:
          path: .nflverse-cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Install
        run: pip install pandas scikit-learn

      - name: Build injury-report.json
        run: python scripts/build_injury_data.py --out injuries/injury-report.json --cache .nflverse-cache

      - name: Commit if changed
        run: |
          git config user.name "tfs-bot"
          git config user.email "tfs-bot@users.noreply.github.com"
          git add injuries/injury-report.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Injury report data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
